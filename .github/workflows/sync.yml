name: Upstream Core Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  sync-core:
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Sync upstream Worker core only
        run: |
          git config user.name "GH Action - Upstream Core Sync"
          git config user.email "action@github.com"
          git remote add upstream https://github.com/cmliu/edgetunnel.git
          git fetch upstream main
          git show upstream/main:_worker.js > _worker-core.js
          if git diff --quiet -- _worker-core.js; then
            echo "Upstream core is already current."
            exit 0
          fi
          git add _worker-core.js
          git commit -m "chore: sync upstream Worker core"
          git push origin main
